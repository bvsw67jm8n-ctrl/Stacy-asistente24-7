<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacy, de Station 24 Fitness</title>
<style>
@font-face{font-family:'Archivo';src:url('fonts/archivo-var.woff2') format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:'Syne';src:url('fonts/syne-800.woff2') format('woff2');font-weight:800;font-display:swap}
:root{--o:#E45604;--o2:#FF7A2E;--card:#141414;--line:#2A2A2A;--g1:#D6D6D6;--g2:#9A9A9A;--ok:#3DDC84}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
html{color:var(--g1);font-family:'Archivo',system-ui,sans-serif;font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--o2);outline-offset:4px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:absolute;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;padding:26px 5vw;pointer-events:none}
.top img{width:120px;height:auto;display:block}

.hero{position:relative;height:100vh;height:100svh;overflow:hidden}
#orb{position:absolute;inset:0;width:100%;height:100%;display:block}
.orb-hit{position:absolute;border-radius:50%;background:transparent;border:0;cursor:pointer;z-index:3}

/* Capacidades */
.caps{list-style:none;position:absolute;inset:0;pointer-events:none;z-index:4}
.caps li{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
.cap{all:unset;position:relative;display:block;width:0;height:0;cursor:pointer;pointer-events:auto}
.demo-on .cap{pointer-events:none}
.dot{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#000;border:2px solid var(--o);transition:background .3s,box-shadow .3s,transform .3s}
.lbl{position:absolute;left:0;top:0;width:max-content;max-width:var(--mw,220px);
  transform:translate(calc(-50% + var(--c,0) * 50% + var(--c,0) * var(--off,22px)),-50%)}
[data-side="-1"] .lbl{text-align:right}
[data-side="1"] .lbl{text-align:left}
.cap-t{display:block;color:#fff;font-weight:800;font-size:19px;font-stretch:104%;line-height:1.15}
.cap-d{display:block;color:var(--g2);font-size:15px;font-stretch:90%;line-height:1.3;margin-top:3px}
.cap:hover .dot,.cap.on .dot{background:var(--o);transform:scale(1.25);box-shadow:0 0 0 7px rgba(228,86,4,.16),0 0 26px rgba(228,86,4,.8)}
.cap.on .cap-t,.cap:hover .cap-t{color:var(--o2)}
.cap.on .cap-d,.cap:hover .cap-d{color:var(--g1)}
.cap.on .lbl::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:2px;background:linear-gradient(90deg,transparent,var(--o2),transparent);animation:scan .9s cubic-bezier(.2,.8,.2,1) both}
.cap:focus-visible .lbl{outline:2px solid var(--o2);outline-offset:6px;border-radius:6px}
.invite .dot{animation:invite 2.8s ease-in-out infinite;animation-delay:calc(var(--i) * .25s)}
@keyframes invite{0%,70%,100%{box-shadow:0 0 0 0 rgba(228,86,4,0)}20%{background:var(--o);box-shadow:0 0 0 8px rgba(228,86,4,.18),0 0 22px rgba(228,86,4,.8)}40%{background:#000}}
@keyframes scan{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:.55}}

/* Saludo y subtítulos */
.hello{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);width:min(92vw,960px);text-align:center;z-index:4;transition:opacity .5s}
.demo-on .hello{opacity:0;pointer-events:none}
.stage{display:grid;align-items:end;justify-items:center;min-height:112px}
.stage > *{grid-area:1/1}
h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(40px,4.6vw,68px);white-space:nowrap;line-height:1;color:#fff;letter-spacing:-.02em;
  opacity:0;transform:translateY(14px);filter:blur(10px);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,.8,.2,1),filter 1.1s,letter-spacing 1.1s,text-shadow .4s}
.awake h1{opacity:1;transform:none;filter:none}
h1.saying{text-shadow:0 0 28px rgba(228,86,4,.65)}
.awake h1.gone{opacity:0;transform:translateY(-18px);filter:blur(12px);letter-spacing:.12em}
.caption{max-width:760px;font-size:clamp(19px,1.6vw,24px);line-height:1.4;color:#fff;opacity:0;transition:opacity .5s}
.caption.show{opacity:1}
.caption .w{opacity:.14;transition:opacity .2s}
.caption .w.in{opacity:1}
.hint{margin-top:14px;color:var(--g2);font-size:17px;opacity:0;transition:opacity .6s}
.hint.show{opacity:1}
.hint.strong{color:#fff}
.caps-m{display:none}
.note{position:absolute;right:5vw;bottom:2.6vh;z-index:4;color:#5f5f5f;font-size:14px;text-align:right}

/* Panel de demostración */
.demo{position:absolute;z-index:6;top:104px;bottom:8vh;left:47%;right:5vw;max-width:760px;display:flex;flex-direction:column;
  background:rgba(16,16,16,.92);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  opacity:0;transform:translateX(50px);clip-path:inset(0 0 0 100% round 22px);pointer-events:none;
  transition:opacity .5s,transform .8s cubic-bezier(.2,.8,.2,1),clip-path .8s cubic-bezier(.2,.8,.2,1)}
.demo-on .demo{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 22px);pointer-events:auto;transition-delay:.25s}
.demo::before,.demo::after{content:'';position:absolute;width:22px;height:22px;border:2px solid var(--o);pointer-events:none}
.demo::before{top:10px;left:10px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.demo::after{bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.demo-top{display:flex;align-items:center;gap:16px;padding:20px 24px 16px 28px;border-bottom:1px solid var(--line)}
.demo-id{flex:1;min-width:0}
.demo-kind{display:block;color:var(--o2);font-size:15px;font-weight:700}
.demo-title{display:block;color:#fff;font-size:24px;font-weight:900;font-stretch:112%;line-height:1.15}
.timer{font-variant-numeric:tabular-nums;color:var(--g1);font-size:18px;font-weight:700}
.close{background:transparent;color:#fff;border:2px solid var(--o);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:800;cursor:pointer}
.close:hover{background:var(--o);color:#000}
.demo-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.prog{height:3px;background:#1f1f1f}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--o),var(--o2));transition:width .5s}

/* Llamada */
.transcript{flex:1;overflow-y:auto;padding:24px 26px 30px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.transcript > *{flex-shrink:0}
.l-socio{align-self:flex-end;max-width:78%;background:#232323;border-radius:18px 18px 4px 18px;padding:11px 16px;color:var(--g1);animation:pop .35s ease both}
.l-socio.talking{background:#2c2c2c}
.l-socio.talking::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--o2);margin-right:9px;vertical-align:1px;animation:blink 1s infinite}
.l-stacy{align-self:flex-start;max-width:86%;color:#fff;font-size:19px;padding:1px 0 1px 16px;border-left:3px solid var(--o);animation:pop .35s ease both}
.l-stacy .w{opacity:0;transition:opacity .18s}
.l-stacy .w.in{opacity:1}
.l-sys{align-self:flex-start;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--o2);font-stretch:92%;padding-left:19px;animation:pop .35s ease both}
.l-sys.done{color:var(--g1)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(228,86,4,.3);border-top-color:var(--o);animation:rot .8s linear infinite;flex:none}
.l-sys svg{width:16px;height:16px;flex:none}
.l-card{align-self:flex-start;margin-left:19px;width:min(360px,82%);border:1px solid rgba(228,86,4,.75);border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,rgba(228,86,4,.12),rgba(228,86,4,.02));position:relative;overflow:hidden;animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
.l-card::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,160,90,.22) 50%,transparent 70%);transform:translateX(-110%);animation:sweep 1.3s .25s ease-out both}
.l-card b{display:block;color:#fff;font-size:17px;font-weight:800}
.l-card .pr{color:var(--o2);font-size:32px;font-weight:900;font-stretch:112%;line-height:1.1;margin-top:2px}
.l-card .pr small{font-size:15px;color:var(--g2);font-weight:500;font-stretch:100%;margin-left:6px}
.l-card ul{list-style:none;margin-top:8px}
.l-card li{font-size:15px;color:var(--g1);padding-left:14px;position:relative;line-height:1.35;margin-top:4px}
.l-card li::before{content:'';position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--o)}

/* Chat */
.chat-body{flex:1;overflow-y:auto;padding:22px 22px;display:flex;flex-direction:column;gap:8px}
.chat-body > *{flex-shrink:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:#121212}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 38% 34%,#1d1d1d,#000 70%);box-shadow:0 0 0 3px rgba(228,86,4,.9),0 0 18px 4px rgba(228,86,4,.55)}
.avatar svg{width:21px;height:auto;overflow:visible}
.avatar path{fill:none;stroke:#FF9C5E;stroke-width:5;stroke-linejoin:round;filter:drop-shadow(0 0 3px #E45604)}
.chat-head b{display:block;color:#fff;font-size:17px;line-height:1.1}
.chat-head span{display:block;color:var(--ok);font-size:15px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:17px;line-height:1.35;animation:pop .3s ease both}
.msg.in{align-self:flex-start;background:#1f1f1f;color:#fff;border-top-left-radius:4px}
.msg.out{align-self:flex-end;background:var(--o);color:#000;border-top-right-radius:4px;font-weight:500}
.typing{align-self:flex-start;background:#1f1f1f;border-radius:16px;border-top-left-radius:4px;padding:14px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--g2);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
.paycard{margin-top:8px;border-left:3px solid var(--o);background:#111;border-radius:10px;padding:12px 14px}
.paycard b{display:block;color:#fff}
.paycard span{display:block;color:var(--g2);font-size:15px}
.paycard em{display:inline-block;margin-top:10px;font-style:normal;background:var(--o);color:#000;font-weight:800;border-radius:999px;padding:6px 16px;font-size:15px}

/* Training */
.tr{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.tr > *{flex-shrink:0}
.tr-intro{display:flex;gap:20px;align-items:center;animation:pop .5s ease both}
.logo-slot{width:120px;aspect-ratio:1;border:2px dashed #3a3a3a;border-radius:18px;display:grid;place-items:center;text-align:center;color:var(--g2);font-size:14px;padding:10px;flex:none}
.tr-intro p{color:var(--g1);font-size:18px}
.tr-intro strong{color:#fff}
.ask-box{display:flex;align-items:center;gap:12px;border:2px solid var(--o);border-radius:16px;padding:15px 18px;color:#fff;font-size:19px;min-height:60px;animation:pop .5s .2s ease both}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--o2);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
.tr .l-stacy{animation:pop .4s ease both}
.tag{align-self:flex-start;border:1px dashed var(--o);color:var(--o2);border-radius:999px;padding:4px 12px;font-size:15px;animation:pop .4s ease both}

@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sweep{to{transform:translateX(110%)}}

/* Móvil: todo en una pantalla */
@media (max-width:819px){
  .top{padding:18px 20px}
  .top img{width:120px}
  .cap-t{font-size:15px;font-stretch:80%;line-height:1.12}
  .cap-d{display:none}
  .dot{left:-7px;top:-7px;width:14px;height:14px}
  .hello{position:absolute;left:0;right:0;transform:none;width:auto;bottom:auto;padding:0 20px}
  .stage{min-height:84px}
  h1{font-size:clamp(34px,10vw,44px);white-space:normal}
  .hint{font-size:16px;margin-top:10px}
  .demo{left:12px;right:12px;top:220px;bottom:12px;max-width:none}
  .demo-top{padding:16px 16px 12px 22px}
  .demo-title{font-size:20px}
  .timer{display:none}
  .transcript{padding:18px 16px}
  .note{left:20px;right:20px;text-align:center;bottom:10px;font-size:13px}
  .demo-on .note{opacity:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style>
</head>

<main class="hero" id="hero">
  <canvas id="orb" aria-hidden="true"></canvas>
  <button class="orb-hit" id="orbHit" type="button" aria-label="Escuchar a Stacy presentarse"></button>
  <ul class="caps" id="caps" aria-label="Habilidades de Stacy"></ul>

  <div class="hello">
    <div class="stage">
      <h1 id="h1">Hola, soy Stacy</h1>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <p class="hint" id="hint">Toca el círculo para escucharme.</p>
    <ul class="caps-m" id="capsM" aria-label="Habilidades de Stacy"></ul>
  </div>

  <section class="demo" id="demo" aria-live="polite" aria-label="Demostración">
    <div class="demo-top">
      <div class="demo-id"><span class="demo-kind" id="demoKind"></span><span class="demo-title" id="demoTitle"></span></div>
      <span class="timer" id="timer"></span>
      <button class="close" id="close" type="button">Volver</button>
    </div>
    <div class="demo-body" id="demoBody"></div>
    <div class="prog"><i id="prog"></i></div>
  </section>

    ctx.beginPath(); ctx.arc(x0, y0, on ? 3.5 : 2.5, 0, 7); ctx.fill();
    if (!RM && d === 1) {
      const p = (t * (on ? 0.0010 : 0.0003) + i * 0.29) % 1;
      const [px, py] = pointAt(pts, p);
      ctx.fillStyle = `rgba(255,170,110,${Math.sin(p * Math.PI) * (on ? 1 : 0.8)})`;
      ctx.beginPath(); ctx.arc(px, py, on ? 3 : 2.2, 0, 7); ctx.fill();
    }
    if (on && (nd.id === active || active === 'all') && show > 0.9) {
      const ang = Math.atan2(y0 - cy, x0 - cx);
      ctx.save(); ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(228,86,4,1)'; ctx.shadowBlur = 12;
      ctx.strokeStyle = 'rgba(255,150,80,0.95)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, Rr, ang - 0.2, ang + 0.2); ctx.stroke();
      ctx.restore();
    }
    const b = orbit.burst;
    if (!RM && show > 0.9 && b.id && (b.id === nd.id || b.id === 'all')) {
      const bt = t - b.t - (b.id === 'all' ? i * 90 : 0);
      if (bt > 0 && bt < 1300) {
        const q = Math.min(1, bt / 650);
        ctx.strokeStyle = `rgba(255,140,60,${1 - q})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x0, y0, 4 + 26 * q, 0, 7); ctx.stroke();
        for (let k = 0; k < 3; k++) {
          const p = (bt - k * 140) / 750;
          if (p <= 0 || p >= 1) continue;
          const [px, py] = pointAt(pts, p);
          ctx.fillStyle = `rgba(255,200,150,${1 - p * 0.6})`;
          ctx.beginPath(); ctx.arc(px, py, 3.4 - k * 0.6, 0, 7); ctx.fill();
        }
        const dq = Math.max(0, Math.min(1, (bt - 650) / 500));
        if (dq > 0 && dq < 1) {
          const [ex, ey] = pts[pts.length - 1];
          ctx.strokeStyle = `rgba(255,140,60,${1 - dq})`; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(ex + side * 10, ey, 8 + 18 * dq, 0, 7); ctx.stroke();
        }
      }
    }
  });
};

let actx = null;
function getCtx() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  return actx;
}
function meter(el) {
  const m = { an: null, buf: null, peak: 0 };
  m.setup = () => {
    if (m.an || IOS || !getCtx()) return;
    try { const src = actx.createMediaElementSource(el); m.an = actx.createAnalyser(); m.an.fftSize = 512; src.connect(m.an); m.an.connect(actx.destination); m.buf = new Uint8Array(512); } catch (e) { m.an = null; }
  };
  m.level = () => {
    if (!m.an || el.paused) return null;
    m.an.getByteTimeDomainData(m.buf); let s = 0;
    for (const v of m.buf) { const x = (v - 128) / 128; s += x * x; }
    const lv = Math.min(1, Math.sqrt(s / m.buf.length) * 5);
    m.peak = Math.max(m.peak, lv);
    if (el.currentTime > 0.9 && m.peak === 0) return null;
    return lv;
  };
  return m;
}

}

function setTimer(on) {
  clearInterval(timerInt); timerEl.textContent = '';
  if (!on) return;
  const st = Date.now(); timerEl.textContent = '00:00';
  timerInt = setInterval(() => { const s = Math.floor((Date.now() - st) / 1000);
    timerEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 500);
}
const setProg = p => prog.style.width = (p * 100).toFixed(1) + '%';

function playClip(file, tok, onProg, estMs) {
  return new Promise(resolve => {
    let done = false, rf = 0;
    const fin = ok => { if (done) return; done = true; cancelAnimationFrame(rf); callAudio.onended = null; resolve(ok); };
    const simulate = () => {
      const st = performance.now();
      const sim = () => {
        if (demoTok.v !== tok) return fin(false);
        const p = (performance.now() - st) / estMs; onProg(Math.min(1, p));
        if (p >= 1) return fin(true);
        rf = requestAnimationFrame(sim);
      };
      sim();
    };
    const step = () => {
      if (demoTok.v !== tok) { callAudio.pause(); return fin(false); }
      const d = callAudio.duration || estMs / 1000;
      onProg(Math.min(1, callAudio.currentTime / d));
      rf = requestAnimationFrame(step);
    };
    callMeter.peak = 0;
    callAudio._want = true; callAudio.muted = false;
    callAudio.onended = () => { onProg(1); fin(true); };
    callAudio.src = CALL_AUDIO(file);
    callAudio.play().then(step).catch(simulate);
  });
}

    box.querySelector('.caret').remove();
    setProg(0.3 + q * 0.35);
    if (!await wait(500, tok, demoTok)) return false;
    const words = ANS[q].split(' ');
    const d = add('l-stacy', words.map(w => `<span class="w">${w}</span>`).join(' '));
    const ws = d.querySelectorAll('.w');
    heroOrb.speaking = true;
    for (let k = 0; k < ws.length; k++) { ws[k].classList.add('in'); if (!await wait(RM ? 0 : 70 + words[k].length * 30, tok, demoTok)) { heroOrb.speaking = false; return false; } }
    heroOrb.speaking = false;
    if (!await wait(900, tok, demoTok)) return false;
  }
  add('tag', 'Las respuestas saldrán de los procesos oficiales de Station');
  setProg(1);
  return true;
}

async function openDemo(id) {
  const cap = CAPS.find(c => c.id === id); if (!cap) return;
  if (playing) stopIntro(true);
  const tok = ++demoTok.v;
  try { callAudio.pause(); } catch (e) {}
  // Desbloquea el reproductor de llamadas en este mismo toque
  if (cap.kind === 'call') { const sc = SCENARIOS.find(x => x.id === cap.sc); const first = sc.lines.find(l => l[2]); if (first) unlockCallAudio(first[2]); }
  if (primeCtx()) callMeter.setup();
  mode = 'demo'; orbit.target = 1; orbit.hover = null;
  document.body.classList.add('demo-on'); invite(false); hint.classList.remove('show');
  highlight(id); setMark(heroOrb, id);
  $('#demoTitle').textContent = cap.t; $('#demoKind').textContent = ''; body.innerHTML = ''; setProg(0); setTimer(false);
  if (!await wait(RM ? 0 : 900, tok, demoTok)) return;
  let ok;
  if (cap.kind === 'call') ok = await runCall(SCENARIOS.find(s => s.id === cap.sc), tok);
  else if (cap.kind === 'chat') ok = await runChat(tok);
  else ok = await runTraining(tok);
  if (!ok) return;
  $('#close').textContent = 'Volver al menú';
  if (await wait(3200, tok, demoTok)) closeDemo();
}
function closeDemo() {
  demoTok.v++;
  try { callAudio.pause(); } catch (e) {}
  callStacy = false; heroOrb.speaking = false; setTimer(false);
  mode = 'menu'; orbit.target = 0;
  document.body.classList.remove('demo-on');
  $('#close').textContent = 'Volver';
  highlight(null); setMark(heroOrb, 's');
  heard = true; menuHint();
}
$('#close').addEventListener('click', closeDemo);
addEventListener('keydown', e => { if (e.key === 'Escape' && mode === 'demo') closeDemo(); });

/* ---------- Arranque ---------- */
function wake() {
  layout();
  if (RM) { heroOrb.awake = true; document.body.classList.add('awake'); orbit.deploy = 0; menuHint(); return; }
  heroOrb.wakeStart = performance.now();
  setTimeout(() => document.body.classList.add('awake'), 1800);
  setTimeout(() => orbit.deploy = performance.now(), 2300);
  setTimeout(() => { if (!playing && mode === 'menu') { hint.textContent = 'Toca el círculo para escucharme.'; hint.classList.add('show'); } }, 3600);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(wake);
requestAnimationFrame(loop);
})();
</script>
